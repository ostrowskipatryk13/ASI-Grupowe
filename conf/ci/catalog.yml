# Środowisko ci (`kedro run --env ci`): ten sam pipeline na próbce CI.

raw_data:
  type: pandas.CSVDataset
  filepath: data/01_raw/sample.csv

prepared_data:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/prepared_data_ci.csv
  save_args:
    index: false

trained_model:
  type: pickle.PickleDataset
  filepath: data/06_models/trained_model_ci.pkl

model_metrics:
  type: json.JSONDataset
  filepath: data/08_reporting/metrics_ci.json
  save_args:
    indent: 2
