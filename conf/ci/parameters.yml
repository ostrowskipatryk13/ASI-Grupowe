# Środowisko ci: AutoGluon z bardzo krótkim limitem i jednym szybkim modelem

wandb:
  project: asi-iranian-churn
  entity: null
  fingerprint_file: data/01_raw/sample.csv

autogluon:
  label: Churn
  eval_metric: f1
